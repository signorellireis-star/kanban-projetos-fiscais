name: Sincronizar ClickUp e Publicar Kanban

on:
  schedule:
    # Roda automaticamente de segunda a sexta às 07:00, 12:00 e 17:00 (Horário de Brasília / UTC-3)
    - cron: '0 10,15,20 * * 1-5'
  workflow_dispatch: # Permite que você dispare manualmente pelo site do GitHub ou celular

# Permissões necessárias para salvar os dados e publicar no GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sincronizar-e-publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Sincronização ClickUp + Gemini
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          CI: "true"
        run: |
          python atualizar_dados.py --sync-only
          cp kanban_projetos_fiscais_light_dark.html index.html

      - name: Salvar dados atualizados no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js status_cache.json index.html
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Sincronização automática de dados [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma alteração nos dados."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
